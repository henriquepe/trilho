[package]
name = "trilho"
version = "0.3.0"
description = "Trilho: backlogs, projetos e issues"
authors = ["Henrique Pires"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "trilho_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
notify = "8"
